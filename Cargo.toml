[workspace]
resolver = "2"
members = ["crates/core", "crates/syntax", "crates/picker", "crates/lsp", "crates/tui", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/terrabyteian/vix"

[workspace.dependencies]
ropey = "1.6"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "io-util", "macros", "sync", "time", "process"] }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-md = "0.5"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-hcl = "1.1"
nucleo-matcher = "0.3"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
